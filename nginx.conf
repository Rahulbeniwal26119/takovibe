# Main NGINX configuration
user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript image/svg+xml;

    # Your server block for HTTPS
    server {
        listen 443 ssl;
        server_name takovibe.com www.takovibe.com;

        # SSL Certificates
        ssl_certificate /etc/ssl/certs/fullchain.pem;
        ssl_certificate_key /etc/ssl/private/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Root directory for your Astro app
        root /usr/share/nginx/html;
        index index.html;

        # Serve your app
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

