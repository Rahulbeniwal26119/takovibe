version: '3.8'

services:
  portfolio-app:
    image: portfolio-app
    build:
      context: .
      args:
        - ENV=prod
    ports:
      - "8080:8080"
    container_name: portfolio-app
    volumes:
      - /etc/letsencrypt/live/takovibe.com/fullchain.pem:/etc/ssl/certs/fullchain.pem
      - /etc/letsencrypt/live/takovibe.com/privkey.pem:/etc/ssl/private/privkey.pem

