backend:
  name: proxy
  proxy_url: http://54.38.65.238:8081/api/v1
  branch: main

# For local development/testing without authentication
local_backend: true

media_folder: "public/images"
public_folder: "/images"

# Force all YAML values to be quoted
yaml_quote: all

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "mdx"
    yaml_quote: all
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "../../layouts/BlogPost.astro" }
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Date", name: "date", widget: "string", required: true, pattern: ['\d{4}-\d{2}-\d{2}', "Must be YYYY-MM-DD format"] }
      - { label: "Author", name: "author", widget: "string", required: true }
      - { label: "Description", name: "description", widget: "text", required: true }
      - { label: "Featured Image", name: "image", widget: "string", required: true }
      - { label: "Reading Time", name: "readingTime", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: true }
      - { label: "Keywords", name: "keywords", widget: "list", required: false }
      - { label: "Canonical URL", name: "canonical", widget: "string", required: false }
      - { label: "Type", name: "type", widget: "string", required: false }
      - { label: "Series", name: "series", widget: "string", required: false }
      - { label: "Series Order", name: "seriesOrder", widget: "number", required: false }
      - { label: "Body", name: "body", widget: "markdown", required: true, modes: ['raw'] }
